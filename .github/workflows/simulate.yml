name: Simulation (100 users)

# Stability simulation: 100 different users one after another (fake mixer over
# real UDP) and the same users driving the UI on their device sizes.
# Runs when sim-trigger.txt changes (or by hand); reports are uploaded as artifacts.

on:
  workflow_dispatch:
  push:
    paths:
      - 'sim-trigger.txt'

permissions:
  contents: read

jobs:
  sim:
    strategy:
      fail-fast: false
      matrix:
        part: [logic, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Unpack project
        run: |
          ZIP=$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | head -1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d src

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Dependencies
        working-directory: src/mixer_kontrol
        run: flutter pub get

      - name: Run ${{ matrix.part }} simulation
        working-directory: src/mixer_kontrol
        continue-on-error: true
        run: |
          mkdir -p build/sim
          if [ "${{ matrix.part }}" = "logic" ]; then T=test/sim/session_sim_test.dart; else T=test/sim/ui_monkey_test.dart; fi
          flutter test "$T" --reporter expanded 2>&1 | tee build/sim/${{ matrix.part }}_log.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sim-${{ matrix.part }}
          path: src/mixer_kontrol/build/sim/
