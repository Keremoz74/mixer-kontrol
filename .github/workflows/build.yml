name: APK Derle

# RELEASE build: signed only with the private upload key kept in GitHub
# Secrets (never in the repository). If the secrets are missing, or the APK
# carries any other certificate, the build fails and nothing is published.
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the upload keystore (PKCS12), base64 encoded
#   ANDROID_KEYSTORE_PASSWORD its password (key alias: ozmix)

on:
  push:
  workflow_dispatch:

# A newer upload replaces a build still running.
concurrency:
  group: apk-build
  cancel-in-progress: true

permissions:
  contents: write # only to publish the release with the APK

env:
  OZMIX_KEY_ALIAS: ozmix
  # SHA-256 of the upload certificate (CN=OzMix Control, O=Keremoz74, C=TR).
  EXPECTED_CERT_SHA256: a71c91452e446542c3056ee02e532f0c28f61fafd4363a2bf750f744a8d0f7ee

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to exact commits (supply-chain safety).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Projeyi aç
        # Use the most recently uploaded zip, whatever its name.
        run: |
          ZIP=$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | head -1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d src

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PW" ]; then
            echo "::error::Signing secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set (see SECURITY.md)"
            exit 1
          fi
          KS="$RUNNER_TEMP/upload.p12"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          echo "::add-mask::$KEYSTORE_PW"
          {
            echo "OZMIX_KEYSTORE=$KS"
            echo "OZMIX_KEYSTORE_PASSWORD=$KEYSTORE_PW"
            echo "OZMIX_KEY_PASSWORD=$KEYSTORE_PW"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.9' # pinned: same toolchain on every build

      - name: Android projesini hazırla
        working-directory: src/mixer_kontrol
        run: |
          bash ci/prepare_android.sh
          flutter pub get

      - name: APK derle
        working-directory: src/mixer_kontrol
        # Obfuscated Dart; the symbols to read crash traces stay in the build.
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}

      - name: İmzayı doğrula
        # Every APK must carry the upload certificate, or it won't install as
        # an update. Refuse to publish anything else.
        working-directory: src/mixer_kontrol
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee signer.txt
          grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" signer.txt || { echo "::error::APK signed with an unexpected key"; exit 1; }

      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"

      - name: APK'yı yayınla
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OzMix Control ${{ github.run_number }}
          files: src/mixer_kontrol/build/app/outputs/flutter-apk/app-release.apk

      - name: Testler
        working-directory: src/mixer_kontrol
        continue-on-error: true
        run: flutter test test/osc_test.dart test/yamaha_test.dart test/ah_test.dart test/wing_test.dart test/tascam_test.dart test/presonus_test.dart test/preview_test.dart
